<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADU Curricula &amp; Plan Codes</title>
<style>
:root{
  --red:#E31B2A;--red-dark:#B3121F;--red-soft:#FDECEE;
  --ink:#1B1F24;--ink-2:#2C333A;--muted:#6B7280;
  --bg:#F4F5F7;--card:#FFFFFF;--line:#E3E6EA;--hl:#FFF1A8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
a{color:var(--red-dark);text-decoration:none}
a:hover{text-decoration:underline}

/* header */
header{background:var(--ink);color:#fff}
.head{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 24px}
.chip{background:#fff;border-radius:4px;padding:5px 8px;display:flex}
.chip img{height:46px;display:block}
.titles h1{margin:0;font-size:20px;font-weight:600}
.titles p{margin:2px 0 0;color:#C9CED4;font-size:13px}
.rule{height:3px;background:var(--red)}

/* toolbar */
.tools{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tools-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:grid;gap:10px}
.row1{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 420px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid #CDD2D8;border-radius:6px;font:inherit;font-size:14.5px;background:#fff}
.search input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:inline-flex;border:1px solid #CDD2D8;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 12px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--red);color:#fff}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{padding:7px 10px;border:1px solid #CDD2D8;border-radius:6px;font:inherit;font-size:13px;background:#fff;color:var(--ink);max-width:260px}
select:focus{outline:none;border-color:var(--red)}
label.tg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
label.tg input{accent-color:var(--red)}
.btn{border:1px solid #CDD2D8;background:#fff;border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.btn:hover{border-color:var(--red);color:var(--red-dark)}
.count{margin-left:auto;color:var(--muted);font-size:13px}

/* results */
main{max-width:1280px;margin:0 auto;padding:18px 24px 40px}
h2.col{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--red-dark);margin:22px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.col:before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px}
.deg{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;overflow:hidden}
.deg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFBFC}
.deg-h h3{margin:0;font-size:14.5px;font-weight:600}
.lvl{font-size:11.5px;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}
td{padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr.v:last-child td{border-bottom:0}
.code{font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;background:#EEF0F3;border-radius:4px;padding:2px 7px;white-space:nowrap;display:inline-block}
.code.none{background:none;color:#A3A9B1;font-family:inherit;font-style:italic;padding:0}
.muted{color:#A3A9B1;font-style:italic}
.cbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.cbtn:hover,.cbtn.open{border-color:var(--red);color:var(--red-dark);background:var(--red-soft)}
.cbtn b{color:var(--red-dark)}
tr.ct td{background:#FBFBFC;padding:0 16px 12px}
.ctab{width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-top:4px}
.ctab th{background:var(--ink-2);color:#fff;border:0;padding:7px 10px}
.ctab td{padding:6px 10px;font-size:13px}
.ctab tr.sec td{background:var(--red-soft);color:var(--red-dark);font-weight:600;font-size:12px;padding:5px 10px}
.ctab td.cc{font-family:Consolas,"Cascadia Mono",monospace;white-space:nowrap}
.ctab td.cr{text-align:center;width:52px}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.empty{background:var(--card);border:1px dashed #CDD2D8;border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer div{max-width:1280px;margin:0 auto;padding:14px 24px}
@media (max-width:760px){
  .head,.tools-in,main,footer div{padding-left:12px;padding-right:12px}
  th,td{padding:7px 8px}
  .hide-s{display:none}
}
</style>
</head>

const NAMES = {CAS:"College of Arts and Sciences",COB:"College of Business",COE:"College of Engineering",CHS:"College of Health Sciences",COL:"College of Law"};
const ORDER = ["CAS","COB","COE","CHS","COL"];
const level = d => /^Bachelor/i.test(d) ? "Bachelor" : /^(Master|Executive Master)/i.test(d) ? "Master" : /^Doctor/i.test(d) ? "Doctorate" : /Diploma/i.test(d) ? "Diploma" : /^Associate/i.test(d) ? "Associate" : "Other";
const norm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
const tight = s => norm(s).replace(/[\s\-()]/g, "");

// build records
const R = D.rows.map((r, i) => {
  const [college, degree, version, curl, plan, sp, surl, ti] = r;
  const courses = ti >= 0 ? D.tables[ti] : [];
  return {i, college, degree, version, curl, plan, sp, surl, courses, lvl: level(degree),
    progTxt: norm([degree, version, plan, sp, NAMES[college], college].join(" ")),
    progTight: tight([degree, version, plan, sp].join(" ")),
    cTxt: courses.map(c => norm(c[0] + " " + c[1])), cTight: courses.map(c => tight(c[0] + " " + c[1])),
    pTxt: courses.map(c => norm(c[2])), pTight: courses.map(c => tight(c[2]))};
});
// latest version per degree = last row listed for that degree
const lastOf = {}; R.forEach(r => lastOf[r.college + "|" + r.degree] = r.i);

// filters

[...$("fCol").options].slice(1).forEach(o => o.textContent = NAMES[o.value] || o.value);

function fillDeg(){
  const c = $("fCol").value, l = $("fLvl").value, cur = $("fDeg").value;
  $("fDeg").length = 1;
  fill($("fDeg"), [...new Set(R.filter(r => (!c || r.college === c) && (!l || r.lvl === l)).map(r => r.degree))].sort());
  $("fDeg").value = [...$("fDeg").options].some(o => o.value === cur) ? cur : "";
}

let scope = "all";

document.querySelectorAll("#scope button").forEach(b => b.onclick = () => {

});

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text, terms){
  let h = esc(text);
  if (!terms.length) return h;
  const parts = terms.map(t => {
    const m = t.match(/^([a-z]+)(\d+[a-z]?)$/);
    const e = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return m ? e(m[1]) + "\\s*-?\\s*" + e(m[2]) : e(t);
  });
  const re = new RegExp("(" + parts.join("|") + ")", "gi");
  return h.replace(re, "<mark>$1</mark>");
}
// "CSC 201" / "csc-201" -> one token "csc201"; other words stay separate
const tokens = q => norm(q).replace(/\b([a-z]{2,6})\s*-?\s*(\d{3,5}[a-z]?)\b/g, "$1$2").split(" ").filter(Boolean);
const linkCell = (url, text, terms) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${hl(text, terms)}</a>` : (text ? `<span class="muted">${esc(text)}</span>` : `<span class="muted">—</span>`);

function match(r, terms){
  // returns {prog:bool, idx:[course indexes]} or null
  if (!terms.length) return {prog: true, idx: null};
  const isCode = terms.map(t => /^[a-z]+\d/.test(t));
  const all = (txt, tg) => terms.every((t, k) => isCode[k] ? tg.includes(t) : txt.includes(t));
  let prog = false, idx = [];
  if (scope === "all" || scope === "prog") prog = all(r.progTxt, r.progTight);
  if (scope !== "prog") {
    for (let k = 0; k < r.courses.length; k++) {
      const c = scope === "course" ? all(r.cTxt[k], r.cTight[k])
              : scope === "pre" ? all(r.pTxt[k], r.pTight[k])
              : all(r.cTxt[k] + " " + r.pTxt[k], r.cTight[k] + " " + r.pTight[k]);
      if (c) idx.push(k);
    }
  }
  if (!prog && !idx.length) return null;
  return {prog, idx};
}

function courseTable(r, idx, terms){
  const list = idx ?? r.courses.map((_, k) => k);
  if (!r.courses.length) return `<div class="muted" style="padding:8px 0">No course list available for this curriculum page.</div>`;
  let html = `<table class="ctab"><colgroup><col style="width:13%"><col style="width:40%"><col><col class="hide-s" style="width:52px"></colgroup><thead><tr><th>Course</th><th>Title</th><th>Prerequisite(s)</th><th class="hide-s">Cr</th></tr></thead><tbody>`;
  let last = -1;
  for (const k of list) {
    const c = r.courses[k];
    if (c[4] !== last) { last = c[4]; html += `<tr class="sec"><td colspan="4">${esc(D.secs[c[4]])}</td></tr>`; }
    html += `<tr><td class="cc">${hl(c[0], terms)}</td><td>${hl(c[1], terms)}</td><td>${hl(c[2] || "—", terms)}</td><td class="cr hide-s">${esc(c[3])}</td></tr>`;
  }
  return html + `</tbody></table>`;
}

function render(){
  const q = norm($("q").value);
  const terms = q ? tokens(q) : [];
  const fc = $("fCol").value, fl = $("fLvl").value, fd = $("fDeg").value, fp = $("fPlan").value;
  const latest = $("fLatest").checked, nocode = $("fNoCode").checked;
  const hits = [];
  for (const r of R) {
    if (fc && r.college !== fc) continue;
    if (fl && r.lvl !== fl) continue;
    if (fd && r.degree !== fd) continue;
    if (fp && r.plan !== fp) continue;
    if (nocode && r.plan) continue;
    if (latest && lastOf[r.college + "|" + r.degree] !== r.i) continue;
    const m = match(r, terms);
    if (m) hits.push([r, m]);
  }
  const nCourses = hits.reduce((a, [, m]) => a + (m.idx ? m.idx.length : 0), 0);
  $("count").textContent = `${hits.length} of ${R.length} curricula` + (terms.length && scope !== "prog" ? ` · ${nCourses} matching course rows` : "");
  let html = "";
  for (const c of ORDER) {
    const ch = hits.filter(([r]) => r.college === c);
    if (!ch.length) continue;
    html += `<h2 class="col">${esc(NAMES[c] || c)}</h2>`;
    const degs = [...new Set(ch.map(([r]) => r.degree))];
    for (const d of degs) {
      const dh = ch.filter(([r]) => r.degree === d);
      html += `<section class="deg"><div class="deg-h"><h3>${hl(d, terms)}</h3><span class="lvl">${esc(dh[0][0].lvl)} · ${dh.length} version${dh.length > 1 ? "s" : ""}</span></div>

      for (const [r, m] of dh) {
        const showIdx = terms.length && scope !== "prog" && m.idx.length ? m.idx : null;
        const isOpen = showIdx ? !open.has(r.i) : open.has(r.i);
        const n = r.courses.length;
        const btn = n ? `<button class="cbtn${isOpen ? " open" : ""}" data-i="${r.i}">${showIdx ? `<b>${showIdx.length}</b> matching course${showIdx.length > 1 ? "s" : ""}` : `${isOpen ? "Hide" : "Show"} ${n} courses`}</button>` : "";
        html += `<tr class="v"><td>${linkCell(r.curl, r.version, terms)}</td><td>${linkCell(r.surl, r.sp, terms)}</td>
          <td>${r.plan ? `<span class="code">${hl(r.plan, terms)}</span>` : `<span class="code none">not set</span>`}</td><td style="text-align:right">${btn}</td></tr>`;
        if (isOpen) html += `<tr class="ct"><td colspan="4">${courseTable(r, showIdx, terms)}</td></tr>`;
      }
      html += `</tbody></table></section>`;
    }
  }
  $("out").innerHTML = html || `<div class="empty">No curricula match your search and filters.</div>`;
  $("out").querySelectorAll(".cbtn").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (open.has(i)) open.delete(i); else open.add(i);
    render();
  });
}
render();
</script>
</body>
</html>
